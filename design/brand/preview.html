<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Swoosh 飞行小信使图标与小尺寸、单色、反白预览。">
    <title>Swoosh 图标设计</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <header class="header"><a class="home" href="../preview.html"><img src="app-icon.svg" width="40" height="40" alt=""><span>Swoosh</span></a><a class="back" href="../preview.html">返回界面预览</a></header>
    <main>
      <section class="hero" aria-labelledby="title">
        <div class="hero-art"><img src="app-icon.svg" width="224" height="224" alt="Swoosh 新图标：薄荷绿底上的白色飞行小信使，带浅杏色喙"></div>
        <div class="hero-copy"><h1 id="title">Swoosh</h1><p class="description">小信使，嗖地送到。</p><p class="detail">扬起翅膀，轻轻飞向你。圆润的轮廓、一点杏色，让传文件也多一点亲切感。</p><div class="downloads"><a class="primary-link" href="app-icon.svg" download>SVG 源图</a><a class="secondary-link" href="raster/swoosh-1024.png" download>1024 px PNG</a><a class="text-link" href="icon.ico" download>Windows ICO</a></div></div>
      </section>
      <section class="specimens" aria-label="图标适配预览">
        <div class="size-specimen"><h2>小尺寸也要清楚</h2><div class="size-row"><figure><img src="raster/swoosh-16.png" width="16" height="16" alt="16 像素图标"><figcaption>16</figcaption></figure><figure><img src="favicon.svg" width="24" height="24" alt="24 像素图标"><figcaption>24</figcaption></figure><figure><img src="raster/swoosh-32.png" width="32" height="32" alt="32 像素图标"><figcaption>32</figcaption></figure><figure><img src="raster/swoosh-48.png" width="48" height="48" alt="48 像素图标"><figcaption>48</figcaption></figure><figure><img src="raster/swoosh-64.png" width="64" height="64" alt="64 像素图标"><figcaption>64 px</figcaption></figure></div></div>
        <div class="mono-specimen"><h2>浅色界面</h2><div class="wordmark light"><img src="mark.svg" width="52" height="52" alt="绿色单色标志"><span>Swoosh</span></div><p>单色轮廓，适合导航与工具栏。</p></div>
        <div class="mono-specimen"><h2>深色界面</h2><div class="wordmark dark"><img src="mark-white.svg" width="52" height="52" alt="白色单色标志"><span>Swoosh</span></div><p>反白版本，形状和识别保持一致。</p></div>
      </section>
      <footer><span>品牌图标 0.4 · SVG、PNG、ICO</span><span>薄荷绿 · 纸白 · 一点浅杏色</span></footer>
    </main>
  </body>
</html>
